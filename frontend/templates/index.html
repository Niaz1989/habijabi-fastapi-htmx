<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTMX PROJECT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src = "https://unpkg.com/htmx.org@2.0.3"></script>

</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center" >
  <div class="p-6 rounded-lg bg-white border border-slate-300 shadow-xs md:p-6 dark:bg-neutral-800 dark:border-neutral-700">
      <h2 class="text-2xl font-semibold text-slate-900"> User Registration Form </h2>
      <div id="response_message"></div>

      <form hx-post="/amil"
            hx-target="#response_message"
            hx-swap="innerHTML"
            hx-encoding="multipart/form-data"
            hx-on::after-request="this.reset()"
            hx-on:input="document.getElementById('response_message').innerHTML = ''"
            onsubmit="return this.reportValidity()" class="space-y-4">

          <div >
              <label class="block text-sm font-medium text-gray-700">Name</label>
              <input type = "text" name="name" required class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-700 bg-white">
          </div>
          <div class ="grid grid-cols-2 gap-4">
              <div>
              <label class="block text-sm font-medium text-gray-700">Age</label>
               <input type = "number" name="age" required class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-700 bg-white">
              </div>
              <div>
                  <label class="block text-sm font-medium text-gray-700">Height</label>
                  <input type = "number" step="0.1" name="height" required class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-700 bg-white">
              </div>

          </div>

          <div class ="grid grid-cols-2 gap-4">
              <div>
                  <label class="block text-sm font-medium text-gray-700">Weight</label>
                  <input type = "number" step="0.1" name="weight" required class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-700 bg-white">
              </div>
              <div>
                  <label class="block text-sm font-medium text-gray-700">Role</label>
                  <input type = "text" name="role" value="user" required class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-700 bg-white">
              </div>

          </div>
          <div >
              <label class="block text-sm font-medium text-gray-700">Password</label>
              <input type = "password"  name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-700 bg-white">
          </div>
            <div>
        <label class="block text-sm font-medium text-gray-700">Profile Picture</label>
        <input type="file" name="profile_pic" accept="image/*"
               class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
           </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium py-2 px-4 rounded-md shadow-sm transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">Submit
          </button>
      </form>

  </div>



    <!-- LOg IN card -->


<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md mt-6">
    <div id="login-error"  ></div>
    <h2 class="text-2xl font-bold mb-6 text-gray-800 text-center">User Login</h2>
    <form hx-post="/login" hx-target="#login-error" hx-swap="innerHTML" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Username</label>
            <input type="text" name="name" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-700 bg-white">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" name="password" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-700 bg-white">
        </div>
        <button type="submit"
                class="w-full bg-green-600 hover:bg-green-700 active:bg-green-800 text-white font-medium py-2 px-4 rounded-md shadow-sm transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">
            Login to Dashboard
        </button>
    </form>
</div>

</body>
</html>
